[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "paper-to-md"
version = "0.2.1"
description = "Convert academic PDF papers to clean markdown with local LLM/VLM synthesis"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = "MIT"
authors = [
    { name = "Jaime Cernuda", email = "jcernudagarcia@hawk.iilinoistech.edu" }
]
keywords = ["pdf", "markdown", "academic", "docling", "extraction"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = [
    "typer>=0.15.0",
    "rich>=13.0.0",
    "Pillow>=10.0.0",
    "pymupdf>=1.26.6",
    "docling>=2.0.0",
    "claude-agent-sdk>=0.1.14",
    "litellm>=1.50.0",
]

[project.optional-dependencies]
# Docker microservice
service = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.18",
    "arq>=0.26.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pynacl>=1.5.0",
    "pydantic-settings>=2.0.0",
    "structlog>=24.0.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "aiosqlite>=0.20.0",
    "ruff>=0.8.0",
]

[project.scripts]
pdf2md = "pdf2md.cli:app"

[project.urls]
Homepage = "https://github.com/JaimeCernuda/paper-to-md"
Repository = "https://github.com/JaimeCernuda/paper-to-md"

[tool.hatch.build.targets.wheel]
packages = ["pdf2md", "service"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.per-file-ignores]
# CLEANUP_PROMPT is a long prompt string - line length is intentional for readability
"pdf2md/agent/cleanup.py" = ["E501"]

# Note: ROCm PyTorch is Linux-only. On Windows, Docling's internal models
# run on CPU, while VLM descriptions go through Ollama API which uses
# ollama-for-amd with ROCm support for AMD GPUs.
